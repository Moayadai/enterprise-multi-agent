version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ouratech-agent-app
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db_storage:/app/chroma_db_storage
      - ./.env:/app/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - enterprise-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ouratech-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - enterprise-net
    restart: unless-stopped

networks:
  enterprise-net:
    driver: bridge

volumes:
  ollama_models:
